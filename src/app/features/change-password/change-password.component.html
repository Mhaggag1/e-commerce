<section class="page-shell space-y-5">
  <h1 class="text-3xl font-bold">Change password</h1>
  <form [formGroup]="form" (ngSubmit)="changePassword()" class="grid max-w-lg gap-4">
    <label class="grid gap-1"
      >Current password<input
        class="rounded-lg border p-2"
        type="password"
        formControlName="currentPassword" /></label
    ><label class="grid gap-1"
      >New password<input
        class="rounded-lg border p-2"
        type="password"
        formControlName="password" /></label
    ><label class="grid gap-1"
      >Confirm new password<input
        class="rounded-lg border p-2"
        type="password"
        formControlName="rePassword" /></label
    ><button class="button" [disabled]="form.invalid || saving()">Change password</button>
  </form>
  <p role="status">{{ message() }}</p>
</section>
