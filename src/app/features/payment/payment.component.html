<fieldset>
  <legend class="mb-5 text-xl font-bold text-secondary">
    {{ 'UI.PAYMENT_METHOD' | translate }}
  </legend>
  <div class="grid gap-3 sm:grid-cols-2">
    <label
      class="flex cursor-pointer items-start gap-3 rounded-xl border border-[#d3dfd7] p-4 has-checked:border-primary has-checked:bg-[#f1f7f3]"
      ><input
        class="mt-1 accent-primary"
        type="radio"
        name="payment"
        value="cash"
        [checked]="method() === 'cash'"
        (change)="method.set('cash')" /><span class="flex-1"
        ><strong class="block text-sm">{{ 'UI.CASH_DELIVERY' | translate }}</strong
        ><small class="mt-1 block text-[#53685a]">{{ 'UI.CASH_HINT' | translate }}</small></span
      ><i class="fa-regular fa-money-bill-1 text-primary" aria-hidden="true"></i></label
    ><label
      class="flex cursor-pointer items-start gap-3 rounded-xl border border-[#d3dfd7] p-4 has-checked:border-primary has-checked:bg-[#f1f7f3]"
      ><input
        class="mt-1 accent-primary"
        type="radio"
        name="payment"
        value="card"
        [checked]="method() === 'card'"
        (change)="method.set('card')" /><span class="flex-1"
        ><strong class="block text-sm">{{ 'UI.PAY_BY_CARD' | translate }}</strong
        ><small class="mt-1 block text-[#53685a]">{{ 'UI.CARD_HINT' | translate }}</small></span
      ><i class="fa-regular fa-credit-card text-primary" aria-hidden="true"></i
    ></label>
  </div>
</fieldset>
